name: Weekly source and license recheck

# Re-opens every primary source and image license URL, flags stale "last verified" dates,
# requests a Wayback Machine capture for each source, and opens an issue listing anything that failed.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Recheck sources, licenses and staleness
        run: node tools/weekly-recheck.mjs > recheck-report.md || echo "FAILED=1" >> "$GITHUB_ENV"
      - name: Open an issue when something failed
        if: env.FAILED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Source recheck $(date -u +%F): action needed" --body-file recheck-report.md
