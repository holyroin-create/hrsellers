name: Build, gate and deploy
# Quality gates for every push. The site itself is built and published by Cloudflare Pages
# (connected to this repository); GitHub Pages is not enabled, so no deploy job runs here.
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 } # full history: tools/git-dates.mjs reads real edit dates
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Build (release mode — no unverified claims, no placeholder photos)
        run: npm run build
      - name: Gate — HTML validity
        run: npm run gate:html
      - name: Gate — claims register
        run: npm run gate:claims
      - name: Gate — images and licenses
        run: npm run gate:images
      - name: Gate — AdSense/Search policy lint
        run: npm run gate:policy
        env: { RELEASE: '1' }
      - name: Gate — links (internal + external)
        run: npm run gate:links
        env: { CHECK_EXTERNAL: '1' }
      - name: Gate — Lighthouse (performance, accessibility, SEO, best practices)
        run: npx --yes @lhci/cli@0.16.0 autorun
