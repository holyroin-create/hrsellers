name: Build, gate and deploy
# Every gate must pass; a failed gate stops publication.
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Build (release mode — no unverified claims, no placeholder photos)
        run: npm run build
      - name: Gate — HTML validity
        run: npm run gate:html
      - name: Gate — claims register
        run: npm run gate:claims
      - name: Gate — images and licenses
        run: npm run gate:images
      - name: Gate — AdSense/Search policy lint
        run: npm run gate:policy
        env: { RELEASE: '1' }
      - name: Gate — links (internal + external)
        run: npm run gate:links
        env: { CHECK_EXTERNAL: '1' }
      - name: Gate — Lighthouse (performance, accessibility, SEO, best practices)
        run: npx --yes @lhci/cli@0.16.0 autorun
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with: { path: dist }
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
